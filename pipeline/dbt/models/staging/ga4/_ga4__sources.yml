sources:
  - name: ga4
    description: >
      Google's public GA4 e-commerce sample (Google Merchandise Store), read in place (D2).
      One table per day (`events_YYYYMMDD`); `events_*` reads them all and `_TABLE_SUFFIX`
      picks the days. Structure and limits: docs/data-sources.md §2.
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: events_*
        description: One row per GA4 event, with nested parameters, traffic source and e-commerce fields.
