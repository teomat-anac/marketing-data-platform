[project]
name = "mdp-api"
version = "0.1.0"
description = "KPI API of the marketing data platform: reads the BigQuery marts and serves KPIs and the funnel."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "google-cloud-bigquery==3.47.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `bigquery` read the real marts: skipped unless asked for (`-m bigquery`).
addopts = "-ra --strict-markers -m 'not bigquery'"
markers = ["bigquery: reads the real marts in BigQuery; needs credentials and is billed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# The docs write grains as "day × channel"; keep the same sign in docstrings.
allowed-confusables = ["×"]
